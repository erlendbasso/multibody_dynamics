[package]
name = "multibody_dynamics"
version = "0.3.0"
authors = ["Erlend Basso <erlendbasso@gmail.com>"]
description = "Multibody dynamics algorithms in Rust"
edition = "2021"
license = "GPL-3.0"
homepage = "https://github.com/erlendbasso/multibody_dynamics"
repository = "https://github.com/erlendbasso/multibody_dynamics"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = { version = "0.34", default-features = false, features = [
    "libm",
    "alloc",
] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
# num-traits     = { version = "0.2" }
# nalgebra = "0.32"
# typenum        = "1.12"
# num-traits     = { version = "0.2", default-features = false }
approx = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benches"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.bench]
inherits = "release"
debug = true   # keep symbols for profiler

[profile.dev]
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
